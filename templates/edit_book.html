<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="form-container">

        <form method="POST">

            <h1>Edit Book</h1>

            <input
            type="text"
            name="title"
            value="{{ book.title }}"
            required
            >

            <input
            type="text"
            name="author"
            value="{{ book.author }}"
            required
            >

            <button type="submit">
                Update Book
            </button>

        </form>

    </div>

</body>
</html>
