<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="form-container">

        <form method="POST">

            <h1>Admin Login</h1>

            <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
            >

            <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>
</html>
